[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "poseidon2-M31-solidity/=lib/poseidon2-M31-solidity/src/",
    "forge-std/=lib/forge-std/src/",
    "stwo-verifier/=lib/stwo-sol-verifier/contracts/",
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config
